			shellPath = /bin/sh;
			shellScript = "set -e\n# Xcode's PATH is minimal; add Homebrew so `gh` (used by\n# fetch-bundled-tmux.sh to pull the pinned release) resolves.\nexport PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"\n# Idempotent and non-fatal: if the release or `gh` is missing the\n# script exits 0 and we fall through to the warning below.\n\"$SRCROOT/scripts/fetch-bundled-tmux.sh\" || true\n# tmux is the app's one embedded helper. It lives in a `helpers/`\n# subdir rather than straight in Contents/MacOS so it has a stable\n# path distinct from the Swift executable (APFS is case-insensitive)\n# — TmuxResolver looks here first, and LocalPty appends helpers/ to\n# the login-shell PATH so a bare `tmux` resolves to it too. Without\n# it, a Mac with no system tmux cannot start a session at all.\n# A user's own tmux still wins.\nDEST=\"$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/helpers\"\nmkdir -p \"$DEST\"\nslot=\"darwin-$(uname -m)\"   # arm64 host -> tmux-darwin-arm64\nif [ -f \"$SRCROOT/bundled-tmux/tmux-$slot\" ]; then\n  cp -f \"$SRCROOT/bundled-tmux/tmux-$slot\" \"$DEST/tmux\"\n  chmod +x \"$DEST/tmux\"\nelse\n  echo \"warning: no bundled tmux for $slot; app will need a system tmux\" >&2\nfi\n";
		};
