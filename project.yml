name: BentoTerm
options:
  bundleIdPrefix: com.bento.term
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "26.4"
  defaultConfig: Debug
  # Nest groups per directory so Xcode's navigator mirrors the real
  # BentoTermiOS/BentoTermMac/... layout instead of flattening every source
  # root (four top-level "Sources" groups) into the main group.
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: 7M23245ZBD

packages:
  # SwiftTerm was the renderer before libghostty and was dropped when
  # BentoGhosttyKit took over, but the dependency stayed — nothing has
  # imported it in a long time, and its resource bundle (with no privacy
  # manifest of its own) was still shipping inside the App Store binary.
  # Only comments mention it now.
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: "0.7.0"
  BentoTmuxKit:
    path: Modules/BentoTmuxKit
  BentoAgentKit:
    path: Modules/BentoAgentKit
  BentoVoiceKit:
    path: Modules/BentoVoiceKit
  BentoFoundationKit:
    path: Modules/BentoFoundationKit
  BentoFilePreviewKit:
    path: Modules/BentoFilePreviewKit
  GhosttyKit:
    path: Modules/GhosttyKit
  BentoGhosttyKit:
    path: Modules/BentoGhosttyKit
  BentoSessionKit:
    path: Modules/BentoSessionKit
  BentoUISharedKit:
    path: Modules/BentoUISharedKit

targets:
  BentoTermiOS:
    type: application
    platform: iOS
    # Spell the test action out instead of leaning on Xcode's implicit
    # scheme auto-creation: CI runs `xcodebuild test -scheme BentoTermiOS`
    # against a freshly generated project, and an auto-created scheme that
    # silently forgot BentoTermTests would report green while compiling
    # nothing. This is a shared scheme, so it is identical everywhere.
    scheme:
      testTargets:
        - BentoTermTests
    sources:
      - BentoTermiOS/Sources
      - BentoTermiOS/Resources
      - BentoTermiOS/Assets.xcassets
    dependencies:
      - package: Citadel
      - package: BentoTmuxKit
      - package: BentoAgentKit
      - package: BentoVoiceKit
      - package: BentoFoundationKit
      - package: BentoFilePreviewKit
      - package: BentoGhosttyKit
      - package: GhosttyKit
      - package: BentoSessionKit
      - package: BentoUISharedKit
    settings:
      base:
        # The app's accent colour, and the reason it has to be an ASSET rather
        # than only a SwiftUI `.tint(...)`: without this key the system accent
        # is blue, and every corner SwiftUI's environment tint doesn't reach —
        # UIKit hosting views, sheet presentations re-tinting after they settle
        # — falls back to it. That is what made Settings icons come up green and
        # turn blue a moment later.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        # iPad multitasking (Split View / Stage Manager free-resize) requires an
        # EXPLICIT all-four-orientation declaration — an absent key leaves the
        # app locked to a fixed window. iPhone keeps the default (no upside-down).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bento needs microphone access for voice input to terminal."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Bento uses speech recognition to convert voice to text and shell commands."
        # No camera / Face ID: the QR-pairing camera and key-protection Face ID
        # prompts were relay-era leftovers — no code path requests either.
        # Export compliance is declared in the App Store Connect questionnaire,
        # NOT here. `ITSAppUsesNonExemptEncryption` is deliberately absent:
        #
        #   - NO would be false. The app statically links BoringSSL through
        #     swift-crypto and speaks SSH through NIOSSH, so it implements
        #     strong encryption of its own; none of Apple's exemptions
        #     (Apple-OS-only crypto, HTTPS-only, authentication-only) fit.
        #   - YES fails validation until compliance documentation is on file:
        #     it makes the upload demand a matching
        #     `ITSEncryptionExportComplianceCode`, and with none issued the
        #     App Store rejects the build ("Invalid Export Compliance Code …
        #     the key value [] doesn't match", hit on 2026-08-06).
        #
        # With the key absent, App Store Connect asks the export questions once
        # per upload instead, and the answer is recorded on the build rather
        # than in the binary. For 0.1.1 the build was submitted with
        # `usesNonExemptEncryption = false`. To stop being asked every upload,
        # file the compliance documentation in App Store Connect and set the
        # code Apple issues as INFOPLIST_KEY_ITSEncryptionExportComplianceCode.
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: BentoTermiOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        # User-facing app name is BentoTerm; the Xcode target is BentoTermiOS
        # so it does not collide with the macOS target's product name.
        PRODUCT_NAME: BentoTerm
        INFOPLIST_KEY_CFBundleDisplayName: "BentoTerm"
        PRODUCT_BUNDLE_IDENTIFIER: com.bento.term.app
        # App version surfaced in the Settings About block and reported by
        # Telemetry (CFBundleShortVersionString). Keep in step with the Mac
        # target's MARKETING_VERSION — bump alongside release tags.
        #
        # Deliberately still 0.1.1 while the Mac target is on 0.2.0: build 2
        # is in App Store review as 0.1.1, and a build whose version string
        # has moved on cannot attach to that version in App Store Connect.
        # Bump to 0.2.0 (and CURRENT_PROJECT_VERSION to 3) with the next
        # iOS upload, once 0.1.1 has cleared review.
        MARKETING_VERSION: "0.1.1"
        # Build number, distinct from MARKETING_VERSION and never reused: App
        # Store Connect rejects an upload whose (version, build) pair it has
        # already seen. Build 1 was uploaded on 2026-08-03 and superseded.
        CURRENT_PROJECT_VERSION: 2

  BentoTermTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BentoTermTests/Sources
    dependencies:
      - target: BentoTermiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        # xcodegen derives TEST_HOST from the *target* name (BentoTermiOS), but
        # the product is named BentoTerm — spell it out or the host app is missing.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BentoTerm.app/BentoTerm"

  BentoTermMac:
    type: application
    platform: macOS
    # Same reasoning as BentoTermiOS's scheme: `xcodebuild test -scheme
    # BentoTermMac` must compile and run BentoTermMacTests, and an auto-created
    # scheme could silently omit the test action.
    scheme:
      testTargets:
        - BentoTermMacTests
    sources:
      - BentoTermMac/Sources
      - BentoTermMac/Resources/Assets.xcassets
      - BentoTermMac/Resources/Fonts
    dependencies:
      - package: BentoTmuxKit
      - package: BentoAgentKit
      - package: BentoVoiceKit
      - package: BentoFoundationKit
      - package: BentoFilePreviewKit
      - package: BentoGhosttyKit
      - package: GhosttyKit
      - package: BentoSessionKit
      - package: BentoUISharedKit
    settings:
      base:
        # Both platform targets ship the same user-facing product name,
        # "BentoTerm"; the target names (BentoTermMac / BentoTermiOS) keep
        # them distinct inside Xcode.
        PRODUCT_NAME: BentoTerm
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: "BentoTerm"
        # Voice input touches the mic + (Apple engine) speech recognition. Without
        # these usage-description keys macOS TCC HARD-ABORTS the app the moment it
        # accesses the mic — the "hold right-click to record → crash" (BUG-017).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bento needs microphone access for voice input to terminal."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Bento uses speech recognition to convert voice to text and shell commands."
        PRODUCT_BUNDLE_IDENTIFIER: com.bento.term.mac
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # App version surfaced in Finder/About and reported by Telemetry
        # (CFBundleShortVersionString). Bump alongside release tags.
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: 3
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: BentoTermMac/Resources/BentoTermMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postCompileScripts:
      - name: "Embed bundled tmux"
        script: |
          set -e
          # Xcode's PATH is minimal; add Homebrew so `gh` (used by
          # fetch-bundled-tmux.sh to pull the pinned release) resolves.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          # Idempotent and non-fatal: if the release or `gh` is missing the
          # script exits 0 and we fall through to the warning below.
          "$SRCROOT/scripts/fetch-bundled-tmux.sh" || true
          # tmux is the app's one embedded helper. It lives in a `helpers/`
          # subdir rather than straight in Contents/MacOS so it has a stable
          # path distinct from the Swift executable (APFS is case-insensitive)
          # — TmuxResolver looks here first, and LocalPty appends helpers/ to
          # the login-shell PATH so a bare `tmux` resolves to it too. Without
          # it, a Mac with no system tmux cannot start a session at all.
          # A user's own tmux still wins.
          DEST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/helpers"
          mkdir -p "$DEST"
          slot="darwin-$(uname -m)"   # arm64 host -> tmux-darwin-arm64
          if [ -f "$SRCROOT/bundled-tmux/tmux-$slot" ]; then
            cp -f "$SRCROOT/bundled-tmux/tmux-$slot" "$DEST/tmux"
            chmod +x "$DEST/tmux"
          else
            echo "warning: no bundled tmux for $slot; app will need a system tmux" >&2
          fi

  BentoTermMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BentoTermMacTests/Sources
    dependencies:
      - target: BentoTermMac
      # The migrated tests import core (LaunchRecord, TerminalConnectionState,
      # Host) and the app module; the app's own package products are declared
      # here explicitly so the imports resolve independently of the host app's
      # transitive graph.
      - package: BentoTmuxKit
      - package: BentoAgentKit
      - package: BentoVoiceKit
      - package: BentoFoundationKit
      - package: BentoFilePreviewKit
      - package: BentoGhosttyKit
      - package: GhosttyKit
      - package: BentoSessionKit
      - package: BentoUISharedKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        # xcodegen derives TEST_HOST from the *target* name (BentoTermMac), but
        # the product is named BentoTerm and macOS nests the binary under
        # Contents/MacOS — spell it out or the host app is missing.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BentoTerm.app/Contents/MacOS/BentoTerm"
        PRODUCT_BUNDLE_IDENTIFIER: com.bento.term.BentoTermMacTests
        MACOSX_DEPLOYMENT_TARGET: "14.0"

