name: BentoTerm
options:
  bundleIdPrefix: com.bento.term
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "26.4"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: 7M23245ZBD

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: "1.2.0"
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: "0.7.0"
  SwiftTmux:
    path: swift-tmux
  BentoTerminalCore:
    path: bento-terminal-core

targets:
  BentoTermiOS:
    type: application
    platform: iOS
    sources:
      - BentoTermiOS/Sources
      - BentoTermiOS/Resources
      - BentoTermiOS/Assets.xcassets
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - package: SwiftTmux
      - package: BentoTerminalCore
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        # iPad multitasking (Split View / Stage Manager free-resize) requires an
        # EXPLICIT all-four-orientation declaration — an absent key leaves the
        # app locked to a fixed window. iPhone keeps the default (no upside-down).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bento needs microphone access for voice input to terminal."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Bento uses speech recognition to convert voice to text and shell commands."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Bento uses Face ID to protect your SSH keys."
        INFOPLIST_KEY_NSCameraUsageDescription: "Bento uses the camera to scan the pairing QR code shown by your Mac."
        ITSAppUsesNonExemptEncryption: false
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: BentoTermiOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        # User-facing app name is BentoTerm; the Xcode target is BentoTermiOS
        # so it does not collide with the macOS target's product name.
        PRODUCT_NAME: BentoTerm
        INFOPLIST_KEY_CFBundleDisplayName: "BentoTerm"
        PRODUCT_BUNDLE_IDENTIFIER: com.bento.term.app

  BentoTermTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BentoTermTests/Sources
    dependencies:
      - target: BentoTermiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        # xcodegen derives TEST_HOST from the *target* name (BentoTermiOS), but
        # the product is named BentoTerm — spell it out or the host app is missing.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BentoTerm.app/BentoTerm"

  BentoTermMac:
    type: application
    platform: macOS
    sources:
      - BentoTermMac/Sources
      - BentoTermMac/Resources/Assets.xcassets
    dependencies:
      - package: BentoTerminalCore
    settings:
      base:
        # Both platform targets ship the same user-facing product name,
        # "BentoTerm"; the target names (BentoTermMac / BentoTermiOS) keep
        # them distinct inside Xcode.
        PRODUCT_NAME: BentoTerm
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true       # menubar-only, no Dock icon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: "BentoTerm"
        # Voice input touches the mic + (Apple engine) speech recognition. Without
        # these usage-description keys macOS TCC HARD-ABORTS the app the moment it
        # accesses the mic — the "hold right-click to record → crash" (BUG-017).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bento needs microphone access for voice input to terminal."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Bento uses speech recognition to convert voice to text and shell commands."
        PRODUCT_BUNDLE_IDENTIFIER: com.bento.term.mac
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # App version surfaced in Finder/About and reported by Telemetry
        # (CFBundleShortVersionString). Bump alongside release tags.
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: BentoTermMac/Resources/BentoTermMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postCompileScripts:
      - name: "Embed Go binaries (bento + bento-daemon) + bundled tmux"
        script: |
          set -e
          # Xcode's PATH is minimal; add Homebrew so `go` and `make` resolve.
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          ( cd "$SRCROOT/desktop" && make build )
          # Helpers live in a `helpers/` subdir rather than straight in
          # Contents/MacOS: it keeps the Go `bento` CLI clear of the Swift
          # executable (APFS is case-insensitive) and gives each a distinct
          # path that TmuxResolver / BentoCLI can look up.
          DEST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/helpers"
          mkdir -p "$DEST"
          cp -f "$SRCROOT/desktop/bin/bento"        "$DEST/"
          cp -f "$SRCROOT/desktop/bin/bento-daemon" "$DEST/"
          # Bundle tmux so tmux -CC (the tiled multi-pane sessions) works on
          # Macs with no system tmux. TmuxResolver already looks here first,
          # and LocalPty appends helpers/ to the login-shell PATH so a bare
          # `tmux` resolves to this too. `make build` runs fetch-bundled-tmux
          # above, so the slot binary is present. A user's own tmux still wins.
          slot="darwin-$(uname -m)"   # arm64 host -> tmux-darwin-arm64
          if [ -f "$SRCROOT/desktop/bin/bundled/tmux-$slot" ]; then
            cp -f "$SRCROOT/desktop/bin/bundled/tmux-$slot" "$DEST/tmux"
            chmod +x "$DEST/tmux"
          else
            echo "warning: no bundled tmux for $slot; app will need a system tmux" >&2
          fi
