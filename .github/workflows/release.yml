# Tag-triggered release: build, sign and notarize the Mac app (arm64-only)
# and upload it as an asset on a GitHub release tagged from the workflow
# trigger.
#
# Triggers
#   - push of a tag matching v* (e.g. v0.1.0). CI cuts a release immediately.
#   - workflow_dispatch: manual button, takes a `tag` input. Useful for
#     re-running a failed build — the publish step uses --clobber.
#
# Layout of release assets
#   BentoTerm-macos-arm64.zip   the Mac app (Developer ID signed, notarized)
#   *.sha256                    side-car checksum for each archive
#
# Intel Mac is intentionally omitted: GH-hosted Intel runners are queue-
# starved post-deprecation and Intel-Mac users currently aren't a target.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must already match a pushed tag, e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  # Resolves the release tag once. Push events get it from github.ref_name;
  # workflow_dispatch reads the manual input.
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  # arm64-only Mac app. Currently unsigned — first-launch on a
  # foreign Mac shows the Gatekeeper warning until D (notarize) lands.
  mac-app:
    needs: resolve-tag
    # The codebase needs Xcode 26 (macos-15's Xcode 16.x fails to compile
    # it — that broke the v0.1.0 first attempt). macos-26 ships Xcode 26.x
    # and reads the objectVersion 77 format xcodegen emits natively, so no
    # project-format downgrade is needed either.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      # Not best-effort any more: the bundled tmux is what lets the app start
      # a session on a Mac with no system tmux, so a release without it is
      # broken for exactly the users who download a release. fetch-bundled-
      # tmux.sh exits 0 on a missing release, so assert the file afterwards.
      - name: Fetch bundled tmux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          scripts/fetch-bundled-tmux.sh
          test -x bundled-tmux/tmux-darwin-arm64 \
            || { echo "ERROR: bundled tmux missing — refusing to ship an app that needs a system tmux" >&2; exit 1; }

      - name: Generate Xcode project
        run: xcodegen

      # ---- code signing setup -------------------------------------------
      # Decrypt the MACOS_CERT_P12_BASE64 secret into a fresh, password-
      # protected temporary keychain. The keychain is throwaway: the runner
      # is ephemeral and we delete it at the end of the job anyway.
      - name: Set up signing keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD:   ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH="${RUNNER_TEMP}/bento-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASS=${KEYCHAIN_PASS}" >> "$GITHUB_ENV"

          P12="${RUNNER_TEMP}/cert.p12"
          echo "${MACOS_CERT_P12_BASE64}" | base64 --decode > "${P12}"

          security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
          # Apple Keychain exports use RC2-40-CBC which OpenSSL 3 rejects,
          # but `security import` still understands it.
          security import "${P12}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${MACOS_CERT_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          # Grant codesign access to the imported key without a UI prompt.
          security set-key-partition-list \
            -S "apple-tool:,apple:,codesign:" \
            -s -k "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}" >/dev/null
          # Prepend to search list so codesign + xcodebuild find our cert.
          security list-keychains -d user -s \
            "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')
          rm "${P12}"

      - name: Resolve signing identity
        run: |
          identity="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.* "([^"]+)".*/\1/')"
          if [ -z "$identity" ]; then
            security find-identity -v -p codesigning "${KEYCHAIN_PATH}" >&2
            echo "ERROR: no Developer ID Application identity in keychain" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"
          echo "Signing as: ${identity}"

      # ---- build --------------------------------------------------------
      - name: Build BentoTerm.app (Release, signed)
        # postCompileScript copies the bundled tmux into
        # BentoTerm.app/Contents/MacOS/helpers. xcodebuild signs the Swift
        # bundle; we sign the helper explicitly in the next step before
        # re-sealing the outer bundle.
        run: |
          xcodebuild -project BentoTerm.xcodeproj \
            -scheme BentoTermMac \
            -configuration Release \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO ARCHS=arm64 \
            DEVELOPMENT_TEAM="${{ secrets.MACOS_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${SIGN_IDENTITY}" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${KEYCHAIN_PATH}" \
            build

      # The postCompileScript is the only thing putting tmux in the bundle and
      # it warns rather than fails, so assert here — a release .app without
      # helpers/tmux cannot start a session on a Mac lacking system tmux.
      - name: Verify embedded helpers
        run: |
          set -e
          helpers="build/Build/Products/Release/BentoTerm.app/Contents/MacOS/helpers"
          test -x "$helpers/tmux" || { echo "ERROR: $helpers/tmux missing" >&2; exit 1; }
          ls -l "$helpers"

      - name: Sign embedded helpers + re-seal bundle
        run: |
          set -e
          app="build/Build/Products/Release/BentoTerm.app"
          # Inner first: the bundled tmux (currently the only helper, but the
          # loop stays general). Hardened runtime is required for
          # notarization; --timestamp pins a secure timestamp, which is what
          # staples to. An empty helpers/ dir makes the glob literal, hence
          # the `[ -f ]` guard.
          for f in "$app/Contents/MacOS/helpers/"*; do
            [ -f "$f" ] || continue
            codesign --force --options=runtime --timestamp \
              --keychain "${KEYCHAIN_PATH}" \
              --sign "${SIGN_IDENTITY}" \
              "$f"
          done
          # Re-sign the app so its seal covers the freshly-signed helpers.
          codesign --force --options=runtime --timestamp \
            --keychain "${KEYCHAIN_PATH}" \
            --sign "${SIGN_IDENTITY}" \
            --entitlements BentoTermMac/Resources/BentoTermMac.entitlements \
            "$app"
          # Sanity check: codesign --verify exits non-zero if anything is
          # mis-signed, mis-sealed, or has a broken nested signature.
          codesign --verify --deep --strict --verbose=2 "$app"

      # ---- notarize (best effort) --------------------------------------
      # Apple's notary service routinely finishes in 5-15 minutes but can
      # spike >45m during peak hours, and there is nothing we can do
      # client-side to speed it up. Treating notarization as a hard
      # requirement blocks the entire release on Apple's queue depth.
      # We run it best-effort: the .app is always Developer-ID-signed
      # and installable; users get the right-click-Open prompt on first
      # launch when we couldn't get a staple ticket in time.
      - name: Notarize (best effort)
        id: notarize
        continue-on-error: true
        env:
          NOTARY_KEY_ID:    ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8:    ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          set -e
          app="build/Build/Products/Release/BentoTerm.app"
          submit_zip="${RUNNER_TEMP}/BentoTerm-notary.zip"
          p8="${RUNNER_TEMP}/AuthKey.p8"
          printf '%s' "${NOTARY_KEY_P8}" > "${p8}"

          # notarytool needs the .app inside a zip (or .dmg / .pkg). This
          # is *not* the artifact users download — that gets re-zipped
          # after the staple ticket is attached.
          ditto -c -k --sequesterRsrc --keepParent "$app" "${submit_zip}"

          xcrun notarytool submit "${submit_zip}" \
            --key      "${p8}" \
            --key-id   "${NOTARY_KEY_ID}" \
            --issuer   "${NOTARY_ISSUER_ID}" \
            --wait \
            --timeout  60m

          rm "${p8}"

      # Stapler only runs when notary actually completed (not on the
      # continue-on-error skip path). The released zip is signed either
      # way; staple is the difference between "no Gatekeeper prompt" and
      # "user has to right-click → Open the first time".
      - name: Staple notary ticket
        if: steps.notarize.outcome == 'success'
        run: |
          set -e
          app="build/Build/Products/Release/BentoTerm.app"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

      - name: Note un-notarized release
        if: steps.notarize.outcome != 'success'
        run: |
          echo "::warning::Notarization did not complete in 60m — release ships signed but not stapled. Users right-click → Open on first launch."

      # ---- package -------------------------------------------------------
      # Two artifacts on purpose. The .zip is what the Homebrew cask installs
      # (`brew` unpacks it; a disk image would only add a mount step). The .dmg
      # is what a human downloads from the site or the releases page: it opens
      # to a window showing the app, an Applications alias, and an arrow
      # between them, which is the install instruction most Mac users already
      # know. Built AFTER the staple so the app inside carries its ticket, and
      # before the keychain teardown so the image can be signed.
      - name: Build disk image
        run: |
          set -e
          mkdir -p artifacts
          scripts/dmg/make-dmg.sh \
            build/Build/Products/Release/BentoTerm.app \
            artifacts/BentoTerm-macos-arm64.dmg \
            BentoTerm

      # The app inside is already stapled, so Gatekeeper is satisfied once the
      # user drags it across. This is about the step before that: an
      # un-notarized disk image throws its own warning when the download is
      # opened, and the user never reaches the app. Best-effort for the same
      # reason as the app's notarization — Apple's queue is not ours to
      # control, and a signed-but-unstapled image still installs.
      - name: Notarize disk image (best effort)
        id: notarize_dmg
        continue-on-error: true
        if: steps.notarize.outcome == 'success'
        env:
          NOTARY_KEY_ID:    ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8:    ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: |
          set -e
          p8="${RUNNER_TEMP}/AuthKey-dmg.p8"
          printf '%s' "${NOTARY_KEY_P8}" > "${p8}"
          xcrun notarytool submit artifacts/BentoTerm-macos-arm64.dmg \
            --key "${p8}" --key-id "${NOTARY_KEY_ID}" --issuer "${NOTARY_ISSUER_ID}" \
            --wait --timeout 60m
          rm "${p8}"
          xcrun stapler staple artifacts/BentoTerm-macos-arm64.dmg
          xcrun stapler validate artifacts/BentoTerm-macos-arm64.dmg

      - name: Package
        run: |
          set -e
          app="build/Build/Products/Release/BentoTerm.app"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/BentoTerm-macos-arm64.zip
          (cd artifacts && shasum -a 256 BentoTerm-macos-arm64.zip > BentoTerm-macos-arm64.zip.sha256)
          (cd artifacts && shasum -a 256 BentoTerm-macos-arm64.dmg > BentoTerm-macos-arm64.dmg.sha256)

      - name: Tear down signing keychain
        if: always()
        run: |
          security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: [resolve-tag, mac-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ needs.resolve-tag.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes
          fi
          gh release upload "$tag" artifacts/* --clobber

      # Point the Homebrew tap at the release we just published.
      #
      # The cask lives in NovaShang/homebrew-tap, not here: Homebrew resolves
      # a tap name by prepending "homebrew-" with no fallback to a bare repo
      # name, so a tap has to be its own repository. That makes this a
      # cross-repo push, which GITHUB_TOKEN cannot do — hence the PAT.
      #
      # Failing loudly rather than warning: the release is already published
      # by this point, so a silent skip would leave the tap pointing at the
      # previous version with nothing to indicate it.
      - name: Update cask in the Homebrew tap
        env:
          # Fine-grained PAT, contents:write on NovaShang/homebrew-tap only.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-tag.outputs.tag }}"
          version="${tag#v}"

          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set — ${tag} is published but the cask still points at the previous release" >&2
            exit 1
          fi

          # Sidecar written by the Package step as "<sha>  <filename>".
          sha="$(awk '{print $1}' artifacts/BentoTerm-macos-arm64.zip.sha256)"
          case "$sha" in
            [0-9a-f]*) [ "${#sha}" -eq 64 ] ;;
            *) false ;;
          esac || { echo "::error::bad sha256 '$sha'" >&2; exit 1; }

          git clone --depth=1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/NovaShang/homebrew-tap.git" tap
          cd tap

          # Anchored to column 0 + two spaces so only the cask's own
          # top-level stanzas match — a sha256 appearing anywhere else in
          # the file is left alone, and the placeholder digest cannot
          # survive a release.
          sed -i -E \
            -e "s|^  version \".*\"$|  version \"${version}\"|" \
            -e "s|^  sha256 \"[0-9a-f]{64}\"$|  sha256 \"${sha}\"|" \
            Casks/bento-term.rb

          grep -q "  sha256 \"${sha}\"" Casks/bento-term.rb \
            || { echo "::error::cask sha256 not rewritten" >&2; exit 1; }

          if git diff --quiet Casks/bento-term.rb; then
            echo "cask already describes ${version}"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "bento-term ${version}" Casks/bento-term.rb
          git push origin HEAD:main
