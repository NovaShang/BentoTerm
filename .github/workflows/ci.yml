# CI for the Bento apps. Runs on every push and PR.
#
# Critically, this workflow NEVER compiles tmux from source — it fetches the
# prebuilt binary from the release tag pinned in scripts/bundled-tmux.version.
# Building tmux + libevent takes several minutes; pulling a binary takes
# seconds. The build-bundled-tmux.yml workflow is what produces those
# binaries when the version pin changes.
#
# The fetch step is wrapped so a missing release (e.g. immediately after a
# version bump, before the release workflow has finished) doesn't break CI:
# the runtime resolver falls back to system tmux, and CI only needs to verify
# that the resolver itself + the surrounding code works.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # Split from the app job on purpose. These tests need no Xcode project, no
  # xcodegen and no simulator, so they finish in a couple of minutes and
  # report a package-level regression without waiting behind a full Xcode
  # build. Everything the app job needs is genuinely shared setup, which is
  # why the two xcodebuild invocations stay together in one job below.
  packages:
    name: packages (swift test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The SwiftTmux suite drives a real tmux server on a private -L socket.
      # Without a tmux binary that whole suite quietly self-disables
      # (`.enabled(if: LiveTmux.isAvailable)`) and CI would be green on a
      # fraction of the tests it thinks it ran.
      - name: Ensure tmux is installed
        run: brew list tmux >/dev/null 2>&1 || brew install tmux

      - name: Terminology check
        run: scripts/check-terminology.sh

      # Every Modules/* package that ships a Tests/ directory, discovered
      # rather than listed: the module split renamed bento-terminal-core out
      # of existence and this job kept pointing at the old path, so from
      # 2026-08-03 CI was red while also testing exactly one of the eight
      # packages that had tests. A list would have rotted the same way.
      #
      # Packages without Tests/ are skipped on purpose — Modules/GhosttyKit
      # is a binary-target wrapper with no buildable target, and `swift test`
      # errors out on it.
      #
      # The floor is a ratchet against silent shrinkage: if a package stops
      # being discovered, this fails instead of quietly covering less.
      - name: swift test (every Modules package with tests)
        run: |
          set -euo pipefail
          tested=0
          for pkg in Modules/*/; do
            [ -d "${pkg}Tests" ] || continue
            echo "::group::swift test ${pkg}"
            swift test --package-path "$pkg"
            echo "::endgroup::"
            tested=$((tested + 1))
          done
          echo "tested ${tested} package(s)"
          if [ "$tested" -lt 7 ]; then
            echo "::error::only ${tested} package(s) tested, expected at least 7" >&2
            exit 1
          fi

  apps:
    name: apps (xcodebuild build + test)
    # The codebase needs Xcode 26. macos-latest still maps to macos-15
    # (Xcode 16.x), which is why this job was red for weeks — pin the
    # macos-26 image (Xcode 26.x) explicitly until -latest catches up.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      # Cache the prebuilt tmux across runs so we don't hit the GH API for
      # every CI invocation. Keyed on the version file so a pin bump
      # invalidates automatically.
      - name: Cache bundled tmux
        uses: actions/cache@v4
        with:
          path: bundled-tmux
          key: bundled-tmux-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bundled-tmux.version') }}

      - name: Fetch bundled tmux
        # GITHUB_TOKEN gives `gh release download` access without an extra login.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-bundled-tmux.sh

      - name: Generate Xcode project
        run: xcodegen

      # Unsigned build — we're verifying compilation, not producing a
      # signed artifact. Code-signing happens in the release workflow.
      # -scheme, not -target: the legacy target build fails to resolve
      # the local SwiftTmux package dependency (reproduced locally on
      # Xcode 26); scheme builds resolve the package graph correctly.
      - name: xcodebuild BentoTermMac
        run: |
          xcodebuild -project BentoTerm.xcodeproj \
            -scheme BentoTermMac -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build

      # `test`, not `build`: this both compiles the iOS app and runs the
      # BentoTermTests bundle. Nothing else in CI compiles that target — when
      # the product rename changed the Swift module name, its `@testable
      # import` broke and CI stayed green for four commits. The scheme's test
      # action is declared in project.yml so it can't be silently empty.
      #
      # The simulator is picked at runtime rather than hard-coded to a device
      # name: the runner image's device list changes with every Xcode bump,
      # and a stale name fails with an opaque "destination not found".
      - name: xcodebuild test BentoTermiOS
        run: |
          udid=$(xcrun simctl list devices available \
                   | grep -E '^[[:space:]]+iPhone' | head -1 \
                   | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$udid" ]; then
            echo "::error::no iOS simulator available on this runner"
            exit 1
          fi
          echo "Using simulator $udid"
          xcodebuild -project BentoTerm.xcodeproj \
            -scheme BentoTermiOS -configuration Debug \
            -destination "id=$udid" \
            CODE_SIGNING_ALLOWED=NO test
